<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>贪吃蛇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 50% 0,#1b2a3a,#0a0f15 70%);color:#e6eef5;font-family:system-ui,"Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none}
.app{width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px}
.panel{background:#16212c;border:1px solid #263646;border-radius:12px;padding:12px 16px;box-shadow:0 6px 18px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:space-between;gap:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat span{font-size:12px;color:#8ba0b4;letter-spacing:1px}
.stat b{font-size:22px;line-height:1.1;color:#4ade80}
.stat.alt b{color:#facc15}
.stage{position:relative;padding:8px;background:#16212c;border:1px solid #263646;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
canvas{display:block;width:100%;max-width:100%;height:auto;border-radius:10px;background:#0d141c}
.overlay{position:absolute;inset:8px;border-radius:10px;background:rgba(8,13,19,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center}
.overlay.hide{display:none}
.overlay h2{font-size:20px;color:#f8fafc}
.overlay p{font-size:14px;color:#9fb3c7}
button{font:inherit;cursor:pointer;border:1px solid #2f4459;border-radius:10px;min-height:44px;padding:0 16px;background:#233444;color:#dbe7f1;transition:.15s;touch-action:manipulation}
button:hover{background:#2c4257}
button:active{transform:scale(.97)}
.primary{background:#22c55e;border-color:#22c55e;color:#06280f;font-weight:600}
.primary:hover{background:#34d16d}
.controls{padding:12px}
.controls button{flex:1}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{min-height:46px;background:#1b2836;font-size:16px}
.tip{text-align:center;font-size:12px;color:#7d91a4}
@media (max-width:420px){
 .panel{padding:10px 12px}
 .stat b{font-size:18px}
 .pad button{min-height:42px}
}
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <div class="stat"><span>本局得分</span><b id="score">0</b></div>
    <div class="stat alt"><span>最高分</span><b id="best">0</b></div>
  </div>
  <div class="stage">
    <canvas id="cv" width="400" height="400"></canvas>
    <div class="overlay hide" id="ov">
      <h2 id="ovTitle">游戏结束</h2>
      <p id="ovText"></p>
      <button class="primary" id="ovBtn">再来一局</button>
    </div>
  </div>
  <div class="panel controls">
    <button id="pauseBtn">暂停</button>
    <button id="restartBtn">重新开始</button>
  </div>
  <div class="pad">
    <button data-d="up" style="grid-area:1/2">▲</button>
    <button data-d="left" style="grid-area:2/1">◀</button>
    <button data-d="down" style="grid-area:2/2">▼</button>
    <button data-d="right" style="grid-area:2/3">▶</button>
  </div>
  <p class="tip">键盘方向键或 W A S D 控制方向，空格键暂停与继续</p>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),N=20,G=20;
const DIRS={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
let snake,dir,nd,fd,score,over,paused,timer;
let best=+localStorage.getItem('snakeBest')||0;

function newFood(){
  let p;
  do{p={x:Math.random()*N|0,y:Math.random()*N|0};}
  while(snake.some(s=>s.x===p.x&&s.y===p.y));
  return p;
}
function hud(){
  $('score').textContent=score;
  if(score>best){best=score;localStorage.setItem('snakeBest',best);}
  $('best').textContent=best;
}
function draw(){
  ctx.fillStyle='#0d141c';ctx.fillRect(0,0,400,400);
  ctx.fillStyle='#ef4444';
  ctx.fillRect(fd.x*G+2,fd.y*G+2,G-4,G-4);
  snake.forEach((s,i)=>{
    ctx.fillStyle=i?'#22c55e':'#a3e635';
    ctx.fillRect(s.x*G+1,s.y*G+1,G-2,G-2);
  });
}
function tick(){
  dir=nd;
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){end();return;}
  snake.unshift(h);
  if(h.x===fd.x&&h.y===fd.y){score++;fd=newFood();hud();}
  else snake.pop();
  draw();
}
function end(){
  over=true;clearInterval(timer);
  $('ovTitle').textContent='游戏结束';
  $('ovText').textContent='本局得分 '+score+' 分';
  $('ovBtn').textContent='再来一局';
  $('ov').classList.remove('hide');
}
function togglePause(){
  if(over)return;
  paused=!paused;
  if(paused){
    clearInterval(timer);
    $('ovTitle').textContent='已暂停';
    $('ovText').textContent='点击下方按钮或按空格键继续';
    $('ovBtn').textContent='继续游戏';
    $('ov').classList.remove('hide');
  }else{
    $('ov').classList.add('hide');
    timer=setInterval(tick,130);
  }
  $('pauseBtn').textContent=paused?'继续':'暂停';
}
function turn(d){
  if(over||paused)return;
  if(d.x+dir.x!==0||d.y+dir.y!==0)nd=d;
}
function start(){
  snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];
  dir={x:1,y:0};nd={x:1,y:0};
  score=0;over=false;paused=false;
  fd=newFood();
  $('ov').classList.add('hide');
  $('pauseBtn').textContent='暂停';
  hud();draw();
  clearInterval(timer);
  timer=setInterval(tick,130);
}
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k===' '||k==='spacebar'){e.preventDefault();togglePause();return;}
  const map={arrowup:'up',arrowdown:'down',arrowleft:'left',arrowright:'right',w:'up',s:'down',a:'left',d:'right'};
  const d=DIRS[map[k]];
  if(d){e.preventDefault();turn(d);}
});
document.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>turn(DIRS[b.dataset.d])));
$('pauseBtn').onclick=togglePause;
$('restartBtn').onclick=start;
$('ovBtn').onclick=()=>{over?start():togglePause();};
start();
</script>
</body>
</html>
