<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>习惯打卡清单</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f5f7;color:#1f2430;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
.app{width:100%;max-width:640px;display:flex;flex-direction:column;gap:16px}
header h1{font-size:20px;font-weight:700}
header p{font-size:13px;color:#6b7280;margin-top:4px;line-height:1.6}
.card{background:#fff;border:1px solid #e6e8ec;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:16px;box-shadow:0 1px 2px rgba(20,25,40,.04)}
.addbar{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;height:44px;border:1px solid #dfe2e8;border-radius:8px;padding:0 12px;font-size:15px;font-family:inherit;color:#1f2430;outline:none;background:#fbfbfc}
input[type=text]:focus{border-color:#3b6ef5;background:#fff;box-shadow:0 0 0 3px rgba(59,110,245,.12)}
.addbtn{height:44px;padding:0 22px;border:none;border-radius:8px;background:#3b6ef5;color:#fff;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;flex:0 0 auto}
.addbtn:hover{background:#2f5cd6}
.stats{display:flex;gap:8px}
.stat{flex:1;background:#f7f8fa;border-radius:8px;padding:8px 12px}
.stat span{display:block;font-size:12px;color:#6b7280;margin-bottom:2px}
.stat b{font-size:18px;font-weight:700}
.sec-title{font-size:14px;font-weight:700;color:#3d4453}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:8px;border:1px solid #e6e8ec;border-radius:12px;padding:8px 12px 8px 8px;transition:background .15s,border-color .15s}
.item.done{background:#fafbfc;border-color:#eef0f3}
.tog{width:44px;height:44px;flex:0 0 44px;border:none;background:transparent;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.ring{width:26px;height:26px;border:2px solid #c8cdd8;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:13px;color:transparent;transition:.15s}
.tog:hover .ring{border-color:#3b6ef5}
.item.done .ring{background:#a9b4c4;border-color:#a9b4c4;color:#fff}
.meta{flex:1;min-width:0}
.nm{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12px;color:#6b7280;margin-top:2px}
.item.done .nm{color:#9aa1ad;text-decoration:line-through}
.item.done .sub{color:#b6bcc6}
.del{width:40px;height:40px;flex:0 0 40px;border:none;border-radius:8px;background:transparent;color:#9aa1ad;font-size:15px;cursor:pointer}
.del:hover{background:#fdecec;color:#d64545}
.empty{text-align:center;color:#9aa1ad;font-size:14px;padding:24px 0;line-height:1.7}
@media(max-width:900px){body{padding:16px 12px}.app{gap:12px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>习惯打卡清单</h1>
    <p>每天完成一次打卡，连续天数会自动累加；中断一天则从明天重新计算。</p>
  </header>

  <section class="card">
    <div class="addbar">
      <input id="inp" type="text" maxlength="24" placeholder="输入一个新习惯，例如：阅读 20 分钟">
      <button class="addbtn" id="addBtn">添加</button>
    </div>
    <div class="stats">
      <div class="stat"><span>今日完成</span><b id="s1">0 / 0</b></div>
      <div class="stat"><span>最长连续</span><b id="s2">0 天</b></div>
    </div>
  </section>

  <section class="card">
    <div class="sec-title">我的习惯</div>
    <div class="list" id="list"></div>
  </section>
</div>

<script>
(function(){
  var KEY = 'habit-checkin-v1';
  var habits = [];
  try { habits = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { habits = []; }
  if (!Array.isArray(habits)) habits = [];

  var listEl = document.getElementById('list');
  var inp = document.getElementById('inp');
  var s1 = document.getElementById('s1');
  var s2 = document.getElementById('s2');

  function dayKey(d){
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function todayKey(){ return dayKey(new Date()); }
  function streak(h){
    var set = {};
    h.dates.forEach(function(k){ set[k] = 1; });
    var d = new Date();
    if (!set[dayKey(d)]) d.setDate(d.getDate() - 1);
    var n = 0;
    while (set[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(habits)); } catch (e) {}
  }

  function render(){
    var tk = todayKey();
    listEl.innerHTML = '';
    if (!habits.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = '还没有习惯，先在上方输入框添加一个吧。';
      listEl.appendChild(e);
    }
    habits.forEach(function(h){
      var done = h.dates.indexOf(tk) > -1;
      var row = document.createElement('div');
      row.className = 'item' + (done ? ' done' : '');
      row.innerHTML =
        '<button class="tog" data-act="tog" data-id="' + h.id + '" title="切换今日打卡"><span class="ring">✓</span></button>' +
        '<div class="meta"><div class="nm"></div><div class="sub">连续 ' + streak(h) + ' 天 · 累计 ' + h.dates.length + ' 次</div></div>' +
        '<button class="del" data-act="del" data-id="' + h.id + '" title="删除习惯">✕</button>';
      row.querySelector('.nm').textContent = h.name;
      listEl.appendChild(row);
    });

    var doneCount = habits.filter(function(h){ return h.dates.indexOf(tk) > -1; }).length;
    var best = habits.reduce(function(m, h){ return Math.max(m, streak(h)); }, 0);
    s1.textContent = doneCount + ' / ' + habits.length;
    s2.textContent = best + ' 天';
  }

  function addHabit(){
    var v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    habits.push({
      id: 'h' + Date.now() + Math.random().toString(36).slice(2, 6),
      name: v,
      dates: []
    });
    inp.value = '';
    save();
    render();
    inp.focus();
  }

  document.getElementById('addBtn').addEventListener('click', addHabit);
  inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') addHabit(); });

  listEl.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var id = btn.getAttribute('data-id');
    var act = btn.getAttribute('data-act');
    var tk = todayKey();
    var idx = habits.findIndex(function(h){ return h.id === id; });
    if (idx < 0) return;

    if (act === 'tog') {
      var h = habits[idx];
      var p = h.dates.indexOf(tk);
      if (p > -1) h.dates.splice(p, 1);
      else h.dates.push(tk);
    } else if (act === 'del') {
      habits.splice(idx, 1);
    }
    save();
    render();
  });

  render();
})();
</script>
</body>
</html>
