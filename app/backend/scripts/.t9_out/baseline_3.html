<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个人记账仪表盘</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--line:#e4e9f0;--txt:#1f2937;--mut:#6b7280;--up:#0f9d70;--down:#e0544a;--pri:#3b6ef0;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.55 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:24px 16px}
h1{font-size:20px}
h2{font-size:16px;margin-bottom:16px}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.metric .k{font-size:13px;color:var(--mut)}
.metric .v{font-size:26px;font-weight:700;margin-top:8px;letter-spacing:-.5px}
.metric.balance .v{color:var(--pri)}
.up{color:var(--up)}.down{color:var(--down)}
.mid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:8px}
input,select,button{font:inherit;width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;color:var(--txt);min-height:40px}
input:focus,select:focus{outline:2px solid #c7d5fb;border-color:var(--pri)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.btn{border:0;background:var(--pri);color:#fff;font-weight:600;cursor:pointer}
.btn.ghost{background:#eef2f8;color:#475569}
form{display:flex;flex-direction:column;gap:12px}
.foot{display:flex;gap:12px}
.err{color:var(--down);font-size:13px;display:none}
.err.on{display:block}
.chartbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut{width:132px;height:132px;border-radius:50%;flex:0 0 auto;position:relative;background:#e4e9f0}
.donut::after{content:"";position:absolute;inset:26px;background:#fff;border-radius:50%}
.legend{flex:1;min-width:150px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.legend .li{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.legend .n{flex:1}
.legend .p{color:var(--mut);white-space:nowrap}
.rec{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.chip{font-size:12px;background:#eef2f8;color:#475569;border-radius:999px;padding:2px 9px;white-space:nowrap}
.info{flex:1;min-width:0}
.note{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date{font-size:12px;color:var(--mut)}
.amt{font-weight:700;white-space:nowrap}
.acts{display:flex;gap:8px}
.acts button{width:auto;min-height:36px;padding:4px 10px;font-size:13px;border-radius:8px;cursor:pointer;background:#eef2f8;border:1px solid var(--line);color:#475569}
.empty{color:var(--mut);font-size:14px;padding:16px 0;text-align:center}
@media(max-width:900px){.mid{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}.metric .v{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>个人记账仪表盘</h1>
    <p class="sub">记录每一笔收支,余额、分类占比与最近明细自动更新,数据保存在本机浏览器。</p>
  </header>

  <section class="metrics">
    <div class="card metric balance"><div class="k">账户余额</div><div class="v" id="bal">¥0.00</div></div>
    <div class="card metric"><div class="k">累计收入</div><div class="v up" id="inc">¥0.00</div></div>
    <div class="card metric"><div class="k">累计支出</div><div class="v down" id="exp">¥0.00</div></div>
  </section>

  <section class="mid">
    <div class="card">
      <h2>记一笔</h2>
      <form id="form">
        <div class="row">
          <div><label for="type">类型</label>
            <select id="type"><option value="expense">支出</option><option value="income">收入</option></select>
          </div>
          <div><label for="amount">金额(元)</label>
            <input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00" inputmode="decimal">
          </div>
        </div>
        <div class="row">
          <div><label for="cat">分类</label><select id="cat"></select></div>
          <div><label for="date">日期</label><input id="date" type="date"></div>
        </div>
        <div><label for="note">备注(可选)</label><input id="note" maxlength="24" placeholder="例如:午餐 / 地铁"></div>
        <p class="err" id="err"></p>
        <div class="foot">
          <button class="btn" id="submit" type="submit">添加记录</button>
          <button class="btn ghost" id="cancel" type="button" hidden>取消编辑</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>支出分类占比</h2>
      <div class="chartbox">
        <div class="donut" id="donut"></div>
        <div class="legend" id="legend"></div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>最近记录</h2>
    <div id="list"></div>
  </section>
</div>

<script>
const KEY='ledger_v1';
const COLORS=['#3b6ef0','#0f9d70','#f0a13b','#e0544a','#8b5cf6','#14b8a6','#64748b'];
const CATS={expense:['餐饮','交通','购物','居住','娱乐','其他'],income:['工资','奖金','理财','其他']};
const $=s=>document.querySelector(s);
let data=load(),editId=null;

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return Array.isArray(d)?d:[]}catch(e){return[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
const fmt=n=>'¥'+n.toFixed(2);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fillCats(keep){
  const t=$('#type').value,sel=$('#cat'),cur=keep||sel.value;
  sel.innerHTML=CATS[t].map(c=>`<option>${c}</option>`).join('');
  if(CATS[t].includes(cur))sel.value=cur;
}

function render(){
  const inc=data.filter(d=>d.type==='income').reduce((a,b)=>a+b.amount,0);
  const exp=data.filter(d=>d.type==='expense').reduce((a,b)=>a+b.amount,0);
  $('#bal').textContent=fmt(inc-exp);
  $('#inc').textContent=fmt(inc);
  $('#exp').textContent=fmt(exp);

  const map={};
  data.filter(d=>d.type==='expense').forEach(d=>map[d.cat]=(map[d.cat]||0)+d.amount);
  const items=Object.entries(map).sort((a,b)=>b[1]-a[1]);
  let acc=0;const segs=[];
  items.forEach((it,i)=>{const p=it[1]/exp*100;segs.push(`${COLORS[i%COLORS.length]} ${acc.toFixed(2)}% ${(acc+p).toFixed(2)}%`);acc+=p;});
  $('#donut').style.background=segs.length?`conic-gradient(${segs.join(',')})`:'#e4e9f0';
  $('#legend').innerHTML=items.length?items.map((it,i)=>
    `<div class="li"><span class="dot" style="background:${COLORS[i%COLORS.length]}"></span>`+
    `<span class="n">${esc(it[0])}</span><span class="p">${fmt(it[1])} · ${(it[1]/exp*100).toFixed(1)}%</span></div>`).join('')
    :'<div class="empty">暂无支出数据</div>';

  const list=[...data].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,12);
  $('#list').innerHTML=list.length?list.map(d=>
    `<div class="rec"><span class="chip">${esc(d.cat)}</span>`+
    `<div class="info"><div class="note">${esc(d.note||'无备注')}</div><div class="date">${d.date}</div></div>`+
    `<span class="amt ${d.type==='expense'?'down':'up'}">${d.type==='expense'?'-':'+'}${fmt(d.amount)}</span>`+
    `<div class="acts"><button data-act="edit" data-id="${d.id}">编辑</button>`+
    `<button data-act="del" data-id="${d.id}">删除</button></div></div>`).join('')
    :'<div class="empty">还没有记录,先添加一笔吧</div>';
}

function resetForm(){
  $('#amount').value='';$('#note').value='';$('#date').value=today();
  editId=null;$('#submit').textContent='添加记录';$('#cancel').hidden=true;$('#err').classList.remove('on');
}

$('#type').addEventListener('change',()=>fillCats());
$('#form').addEventListener('submit',e=>{
  e.preventDefault();
  const amount=parseFloat($('#amount').value);
  if(!(amount>0)){$('#err').textContent='请输入大于 0 的有效金额';$('#err').classList.add('on');return;}
  $('#err').classList.remove('on');
  const rec={type:$('#type').value,amount:Math.round(amount*100)/100,cat:$('#cat').value,
    note:$('#note').value.trim(),date:$('#date').value||today()};
  if(editId){const i=data.findIndex(d=>d.id===editId);data[i]=Object.assign(rec,{id:editId});}
  else{data.push(Object.assign(rec,{id:Date.now()}));}
  save();resetForm();render();
});

$('#cancel').addEventListener('click',resetForm);

$('#list').addEventListener('click',e=>{
  const btn=e.target.closest('button');if(!btn)return;
  const id=Number(btn.dataset.id);
  if(btn.dataset.act==='del'){
    data=data.filter(d=>d.id!==id);
    if(editId===id)resetForm();
    save();render();
  }else{
    const d=data.find(x=>x.id===id);if(!d)return;
    $('#type').value=d.type;fillCats(d.cat);
    $('#amount').value=d.amount;$('#note').value=d.note;$('#date').value=d.date;
    editId=id;$('#submit').textContent='保存修改';$('#cancel').hidden=false;
    $('#amount').focus();
  }
});

fillCats();$('#date').value=today();render();
</script>
</body>
</html>
